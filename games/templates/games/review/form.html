{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} — {{ game.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <a href="{% url 'games:game_details' game.pk %}" class="mgl-back">← {{ game.title }}</a>
        <h1 class="h2 mgl-page-title">{{ title }}</h1>
        <form method="post" class="mgl-panel">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'games:reviews_list' game.pk %}" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
