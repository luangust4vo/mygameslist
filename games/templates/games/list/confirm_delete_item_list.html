{% extends 'base.html' %}

{% block title %}Remover {{ item.game.title }} — MyGameList{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Remover da lista?</h3>
        <p>Tem certeza que quer remover <strong>{{ item.game.title }}</strong> da sua lista?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, remover</button>
            <a href="{% url 'games:my_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
