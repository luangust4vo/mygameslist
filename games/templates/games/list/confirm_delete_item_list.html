{% extends 'base.html' %}

{% block title %}Remover {{ item.game.title }} — MyGamesList{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h2 mgl-page-title">Remover da lista?</h1>
        <div class="mgl-panel">
            <p><strong>{{ item.game.title }}</strong> sai da sua lista, junto com o status marcado.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Remover da lista</button>
                <a href="{% url 'games:my_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
