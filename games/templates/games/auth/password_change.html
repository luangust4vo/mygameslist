{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Alterar Senha — MyGameList{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-4">Alterar Senha</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
