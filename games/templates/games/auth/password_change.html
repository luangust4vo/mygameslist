{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Alterar Senha — MyGamesList{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
        <h1 class="h2 mgl-page-title">Alterar senha</h1>
        <form method="post" class="mgl-panel">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
